name: Inspect pinned QAC
on:
  push:
    branches: [feat/quran-phase-2b4-qac]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect QAC morphology archive
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/taziksh/quran-frequencies/079cdc74cd494ec1b35011363288d80cae047c51/data/quranic-corpus-morphology-0.4.txt" -o qac.txt
          sha256sum qac.txt
          wc -cl qac.txt
          grep -c '^(' qac.txt
