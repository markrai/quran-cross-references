name: QSAC Source Provenance Probe
on:
  push:
    branches: [feat/quran-phase-2d1-thematic-annotations]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate immutable upstream source bytes and annotations
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, json, urllib.request
          base='https://raw.githubusercontent.com/dev-ahmadbilal/quran-semantic-annotation-corpus/cb3852b127bfdda6668c5eec9e5c1d9cdcde3810/data/'
          for name in ('qsac-dataset.csv','qsac-ontology.json'):
              url=base+name
              with urllib.request.urlopen(url,timeout=60) as handle:
                  contents=handle.read()
              print(name,'bytes',len(contents),'SHA256',hashlib.sha256(contents).hexdigest(),flush=True)
              if name.endswith('.csv'):
                  rows=list(csv.DictReader([line for line in io.StringIO(contents.decode('utf-8')) if not line.startswith('#')]))
                  print('csv rows',len(rows),'head',[(r['surah'],r['ayah'],r['tags']) for r in rows[:2]],'tail',[(r['surah'],r['ayah']) for r in rows[-2:]],flush=True)
              else:
                  doc=json.loads(contents)
                  tags=[tag['name'] for domain in doc['domains'] for cat in domain['categories'] for tag in cat['tags']]
                  print('ontology domains',len(doc['domains']),'tags',len(tags),'unique',len(set(tags)),flush=True)
          PY
