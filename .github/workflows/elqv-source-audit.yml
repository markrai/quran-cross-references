name: ELQV Source Audit
on:
  push:
    branches: [feat/quran-phase-2d2-emotion-concordance]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Audit immutable research snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, csv, hashlib, io, urllib.request
          commit = '364cdccf6518e35003db51ccf856d9328dbb7ff3'
          url = f'https://raw.githubusercontent.com/Arwaalmrzoqi/ELQV/{commit}/ELQV.csv'
          with urllib.request.urlopen(url,timeout=60) as response:
              raw = response.read()
          print('ELQV SHA256', hashlib.sha256(raw).hexdigest(), 'BYTES', len(raw), flush=True)
          rows = list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
          print('ELQV HEADERS', list(rows[0]),'ROWS',len(rows),flush=True)
          print('ELQV LABELS',dict(collections.Counter(r['Label'] for r in rows)),flush=True)
          print('ELQV EMPTY',sum(not r['Verse Diac'] or not r['Verse'] for r in rows),flush=True)
          keys=[(int(r['Sourah Number']),int(r['Verse Number'])) for r in rows]
          print('ELQV UNIQUE',len(set(keys)),'DUPLICATES',len(keys)-len(set(keys)),flush=True)
          print('ELQV EXAMPLES',[(r['Sourah Number'],r['Verse Number'],r['Label']) for r in rows[:6]],flush=True)
          print('ELQV MINMAX',min(s for s,a in keys),max(s for s,a in keys),min(a for s,a in keys),max(a for s,a in keys),flush=True)
          PY
