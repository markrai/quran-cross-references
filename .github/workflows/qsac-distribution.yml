name: QSAC Assignment Distribution Probe
on:
  push:
    branches: [feat/quran-phase-2d1-thematic-annotations]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Measure independently sourced annotations
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,collections,io,urllib.request
          url='https://raw.githubusercontent.com/dev-ahmadbilal/quran-semantic-annotation-corpus/cb3852b127bfdda6668c5eec9e5c1d9cdcde3810/data/qsac-dataset.csv'
          data=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
          rows=list(csv.DictReader(line for line in io.StringIO(data) if not line.startswith('#')))
          hist=collections.Counter(len(r['tags'].split('|')) for r in rows)
          empty=[(r['surah'],r['ayah']) for r in rows if not r['tags'].strip()]
          unexpected=[(r['surah'],r['ayah'],r['tags']) for r in rows if len(r['tags'].split('|'))>5]
          print('QSAC COUNTS',dict(sorted(hist.items())),flush=True)
          print('QSAC TOTAL',sum(len(r['tags'].split('|')) for r in rows),'MISSING',empty[:10],'OVERFIVE',unexpected[:6],flush=True)
          PY
