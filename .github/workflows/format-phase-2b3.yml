name: Format Phase 2B.3
on:
  push:
    branches: [feat/quran-phase-2b3-expression-explorer]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/core/quran/expression-browser.ts src/quran/expressions.ts src/quran/location.test.ts src/quran/QuranApp.tsx src/quran/QuranExpressionGraph.tsx src/quran/QuranExpressions.tsx tests/e2e/quran-reader.spec.ts
            git commit -m "style(quran): normalize Phase 2B.3 changes with pinned Prettier"
            git push
          fi
