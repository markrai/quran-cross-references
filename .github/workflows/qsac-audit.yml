name: QSAC Duplicate Assignment Audit
on:
  push:
    branches: [feat/quran-phase-2d1-thematic-annotations]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Audit source anomalies without redistributing texts
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,csv,io,json,urllib.request
          base='https://raw.githubusercontent.com/dev-ahmadbilal/quran-semantic-annotation-corpus/cb3852b127bfdda6668c5eec9e5c1d9cdcde3810/data/'
          csv_data=urllib.request.urlopen(base+'qsac-dataset.csv',timeout=30).read().decode('utf-8')
          ontology=json.loads(urllib.request.urlopen(base+'qsac-ontology.json',timeout=30).read())
          tags={t['name'] for d in ontology['domains'] for c in d['categories'] for t in c['tags']}
          reader=csv.DictReader(line for line in io.StringIO(csv_data) if not line.startswith('#'))
          duplicate_rows=[]
          missing=collections.Counter()
          assigned=0
          unique=0
          for row in reader:
              names=row['tags'].split('|')
              assigned+=len(names)
              unique+=len(set(names))
              for name in names:
                  if name not in tags: missing[name]+=1
              if len(set(names))!=len(names): duplicate_rows.append((row['surah'],row['ayah'],names))
          print('QSAC AUDIT raw_assignments',assigned,'unique_assignments',unique,'duplicates',assigned-unique,flush=True)
          print('QSAC AUDIT duplicate_verses',duplicate_rows[:30],flush=True)
          print('QSAC AUDIT unknown_tags',dict(missing),flush=True)
          PY
