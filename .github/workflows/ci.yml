name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint application, scripts and tests
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce type coverage
        run: npm run typecoverage
      - name: Retrieve verified QAC corpus for importer tests
        run: npm run data:qac:fetch
      - name: Enforce unit-test coverage
        run: npm run test:coverage
      - name: Archive unit coverage detail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quran-unit-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate pinned Quran datasets
        run: npm run data:quran
      - name: Generate pinned exact-expression evidence and profile
        run: npm run data:expressions
      - name: Verify byte-identical expression regeneration
        shell: bash
        run: |
          first="$(sha256sum data/quran/generated/expressions.json | cut -d' ' -f1)"
          npm run data:expressions
          second="$(sha256sum data/quran/generated/expressions.json | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::Exact-expression dataset changed between identical builds."
            exit 1
          fi
      - name: Verify byte-identical analytics regeneration
        shell: bash
        run: |
          first="$(sha256sum data/quran/generated/analytics.json | cut -d' ' -f1)"
          npm run data:quran
          second="$(sha256sum data/quran/generated/analytics.json | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::Analytics dataset changed between identical builds."
            exit 1
          fi
      - name: Verify byte-identical topology regeneration
        shell: bash
        run: |
          first="$(sha256sum data/quran/generated/topology.json | cut -d' ' -f1)"
          npm run data:quran
          second="$(sha256sum data/quran/generated/topology.json | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::Curated graph topology changed between identical builds."
            exit 1
          fi
      - name: Verify byte-identical morphology regeneration
        shell: bash
        run: |
          first="$(sha256sum data/quran/generated/morphology.json | cut -d' ' -f1)"
          npm run data:quran
          second="$(sha256sum data/quran/generated/morphology.json | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::Morphology projection changed between identical source builds."
            exit 1
          fi
      - name: Archive exact-expression corpus statistics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quran-expression-profile
          path: data/quran/generated/expression-profile.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record full-corpus SVG layout benchmark
        run: npm run bench:graph

  quran-windows:
    name: Quran source integrity (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint application, scripts and tests on Windows
        run: npm run lint
      - name: Validate pinned Quran sources on Windows
        run: npm run data:quran
      - name: Generate exact-expression evidence on Windows
        run: npm run data:expressions
      - name: Test Quran source integrity, importers and graph
        run: npx vitest run scripts/quran/qac.test.ts scripts/quran/pinned-source.test.ts scripts/quran/datasets.test.ts scripts/quran/graph.test.ts scripts/quran/raw-ignore.test.ts src/core/quran/relationship-evidence.test.ts
      - name: Confirm Quran datasets were published
        shell: pwsh
        run: |
          foreach ($file in @("public/quran-only/data/quran/text.json", "public/quran-only/data/quran/relationships.json", "public/quran-only/data/quran/evidence.json", "public/quran-only/data/quran/expressions.json", "public/quran-only/data/quran/analytics.json", "public/quran-only/data/quran/topology.json", "public/quran-only/data/quran/morphology.json", "public/quran-only/data/quran/manifest.json")) {
            if (-not (Test-Path $file)) { throw "Missing Quran dataset: $file" }
          }

  build:
    name: Build Quran-only site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Quran entry points and artifacts
        run: |
          test -s dist/index.html
          test -s dist/quran/index.html
          test -s dist/data/quran/text.json
          test -s dist/data/quran/relationships.json
          test -s dist/data/quran/evidence.json
          test -s dist/data/quran/analytics.json
          test -s dist/data/quran/topology.json
          test -s dist/data/quran/morphology.json
          test -s dist/data/quran/manifest.json
          test -s dist/data/quran/expressions.json
          test -s dist/manifest.webmanifest
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          test -s dist/icons/icon-maskable-512.png
          test -s dist/social-preview.png
          test -s dist/sw.js
          grep -q 'Quran Cross-References' dist/index.html
          grep -q 'og:image' dist/index.html
          grep -q 'quran-cross-references-shell-' dist/sw.js
          if grep -q 'data/quran/morphology.json' dist/sw.js; then
            echo '::error::Optional morphology must not enter PWA install precache.'
            exit 1
          fi
          if grep -q 'data/quran/expressions.json' dist/sw.js; then
            echo '::error::On-demand exact expressions must not enter the PWA install precache.'
            exit 1
          fi
          if test -e dist/data/translations || test -e dist/data/cross-references || test -e dist/data/words || test -e dist/threads; then
            echo '::error::Legacy Bible app or datasets leaked into the Quran release.'
            exit 1
          fi
      - name: Upload built site for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1
      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  quran-e2e:
    name: Quran reader (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download exact production build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Run desktop and phone acceptance against the production build
        run: npm run test:e2e:ci
      - name: Preserve reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ runner.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Quran site to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, quran-windows, build, quran-e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
