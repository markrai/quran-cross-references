name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate pinned Quran datasets
        run: npm run data:quran

  quran-windows:
    name: Quran source integrity (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate pinned Quran sources on Windows
        run: npm run data:quran
      - name: Test Quran source integrity, importers and graph
        run: npx vitest run scripts/quran/pinned-source.test.ts scripts/quran/datasets.test.ts scripts/quran/graph.test.ts
      - name: Confirm Quran datasets were published
        shell: pwsh
        run: |
          foreach ($file in @("public/quran-only/data/quran/text.json", "public/quran-only/data/quran/relationships.json", "public/quran-only/data/quran/manifest.json")) {
            if (-not (Test-Path $file)) { throw "Missing Quran dataset: $file" }
          }

  build:
    name: Build Quran-only site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Quran entry points and artifacts
        run: |
          test -s dist/index.html
          test -s dist/quran/index.html
          test -s dist/data/quran/text.json
          test -s dist/data/quran/relationships.json
          test -s dist/data/quran/manifest.json
          grep -q 'Quran Cross-References' dist/index.html
          if test -e dist/data/translations || test -e dist/data/cross-references || test -e dist/data/words || test -e dist/threads; then
            echo '::error::Legacy Bible app or datasets leaked into the Quran release.'
            exit 1
          fi
      - name: Upload built site for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1
      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  quran-e2e:
    name: Quran reader (desktop and phone)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download Quran site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise Quran root and legacy deep links
        run: npx playwright test tests/e2e/quran-reader.spec.ts --project=desktop --project=phone
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-quran
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy Quran site to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, quran-windows, build, quran-e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
